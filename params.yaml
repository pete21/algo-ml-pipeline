data_ingestion:
  timeframes: ['10s', '1m', '2m', '3m', '4m', '5m', '10m', '15m', '20m', '30m', '1h', '2h', '4h', '1d']
  timeframe_minutes: [0, 1, 2, 3, 4, 5, 10, 15, 20, 30, 60, 120, 240, 1440]
  timeframe_scalers: [0.22, 0.44, 0.63, 0.77, 0.89, 1, 1.4, 1.7, 2, 2.4, 3.4, 4.8, 6.8, 9.6]
  indexes: [1,5,7,10]
  index_barrier: 1
  index_base: 5
  indexes_higher: [7,10]
  file_name: 'DAX40_USDT_USDT-{timeframe}-futures.parquet'
  high_time_col: 'High'
  low_time_col: 'Low'
  high_time_col_wavelet: 'Close_wavelet'
  low_time_col_wavelet: 'Close_wavelet'

data_preprocessing:
  index_base: 5
  indexes_higher: [7,10]
  timeframes: ['10s', '1m', '2m', '3m', '4m', '5m', '10m', '15m', '20m', '30m', '1h', '2h', '4h', '1d']
  timeframe_scalers: [0.22, 0.44, 0.63, 0.77, 0.89, 1, 1.4, 1.7, 2, 2.4, 3.4, 4.8, 6.8, 9.6]
  file_name: 'data_ohlc_features_{timeframe}.csv'

model_building:
  version: 1
  ngram_range: [1, 3]  
  max_features: 1000
  learning_rate: 0.09
  max_depth: 20
  n_estimators: 367
  model_name: 'DAX40_USDT_USDT_futures_model_{timeframe}_v{version}'
